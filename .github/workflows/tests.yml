name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy==2.5.4 ase==3.29.0 matplotlib==3.11.2 pytest==9.2.0
      - name: Run tests
        run: pytest -v
